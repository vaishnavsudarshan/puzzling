<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PuzzLing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* PuzzLing commits to a single light theme — same calm look on every device. */
:root{
  --bg:#FBFAF8; --surface:#FFFFFF; --surface-2:#F4F3EF;
  --ink:#222630; --muted:#5F6572; --faint:#949aa4;
  --line:#E8E6E0;
  --accent:#3F57A6; --accent-ink:#354a92; --accent-soft:#ECEEF8;
  --gold:#8a6a1f; --gold-soft:#F4EDD9;
  --good:#3B7A54; --good-soft:#E7F1EA;
  --bad:#B04B34; --bad-soft:#F7E9E4;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,"SFMono-Regular",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
a{color:inherit}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
.brand{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.01em;
  background:none;border:0;padding:0;color:var(--ink);display:flex;align-items:baseline;gap:2px}
.brand .q{color:var(--accent)}
.brands{display:flex;align-items:baseline;gap:9px}
.brand-sep{color:var(--faint);font-size:17px;user-select:none}
.brand{transition:opacity .15s}
.brand.off{opacity:.36}
.brand.off .q{color:var(--faint)}
.brand.off:hover{opacity:.68}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{background:none;border:0;color:var(--muted);padding:7px 12px;border-radius:7px;font-weight:500}
.nav button:hover{color:var(--ink);background:var(--surface-2)}
.nav button.on{color:var(--accent-ink);background:var(--accent-soft)}
.spacer{flex:1}
.pts{display:inline-flex;align-items:center;gap:7px;background:var(--gold-soft);color:var(--gold);
  border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);padding:5px 11px;border-radius:999px;
  font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.pts .dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:8px 15px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.who{display:inline-flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);
  display:grid;place-items:center;font-weight:700;font-size:13px}

main{max-width:1080px;margin:0 auto;padding:34px 20px 90px}
.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:700}
.lede{color:var(--muted);max-width:60ch;margin-top:8px}
.h-hero h1{font-size:34px;margin-top:6px}

.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;
  text-align:left;transition:border-color .15s,transform .15s;display:flex;flex-direction:column;gap:10px}
button.card{width:100%;font:inherit;color:inherit}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card h3{font-size:20px}
.card .blurb{color:var(--muted);font-size:14.5px;flex:1}
.card .meta{display:flex;gap:14px;align-items:center;color:var(--faint);font-size:13px;font-weight:600}
.bar-mini{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar-mini i{display:block;height:100%;background:var(--accent);border-radius:3px}

.back{background:none;border:0;color:var(--muted);font-weight:600;padding:6px 0;margin-bottom:14px}
.back:hover{color:var(--accent-ink)}

.plist{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.prow{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:16px 18px;text-align:left;width:100%;color:inherit;font:inherit;
  transition:border-color .15s,transform .15s}
.prow:hover{border-color:var(--accent);transform:translateX(2px)}
.prow .body{flex:1;min-width:0}
.prow h3{font-size:18px}
.prow .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);white-space:nowrap}
.chip.easy{color:var(--good);background:var(--good-soft);border-color:transparent}
.chip.medium{color:var(--gold);background:var(--gold-soft);border-color:transparent}
.chip.hard{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.chip.tag{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent}
.solved-tick{color:var(--good);font-weight:700;font-size:14px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}

.solve{display:grid;grid-template-columns:1fr;gap:26px;margin-top:20px}
@media(min-width:820px){.solve{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:22px 24px}
.panel h2{font-size:24px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.body-blocks{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.body-blocks p{margin:0;color:var(--muted)}
.body-blocks p.lead{color:var(--ink)}
.data{font-family:var(--mono);font-size:14.5px;line-height:1.75;background:var(--surface-2);
  border:1px solid var(--line);border-radius:10px;padding:16px 18px;
  white-space:pre;overflow-x:auto;color:var(--ink)}
.formula{font-family:var(--serif);font-size:20px;text-align:center;padding:15px 12px;letter-spacing:.02em;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--ink)}
.qcard .pre{margin:0 0 12px}
.qcard .pre .formula{font-size:19px}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;
  padding:12px 16px;color:var(--accent-ink);font-size:14.5px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.ptable{border-collapse:collapse;width:100%;font-size:14.5px}
table.ptable th,table.ptable td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);
  padding:8px 14px;text-align:left}
table.ptable tr:last-child td{border-bottom:0}
table.ptable th:last-child,table.ptable td:last-child{border-right:0}
table.ptable th{background:var(--surface-2);font-family:var(--sans);font-weight:700;font-size:11.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
table.ptable td:first-child{font-family:var(--mono)}

.qcard{border:1px solid var(--line);border-radius:11px;padding:16px 17px;margin-bottom:14px;background:var(--surface)}
.qcard .qtext{font-weight:600;margin-bottom:11px}
.ans{display:flex;gap:9px;margin-top:11px;align-items:center}
.link-btn{background:none;border:0;color:var(--muted);font-weight:600;font-size:13px;
  padding:6px 2px;text-decoration:underline;text-underline-offset:2px}
.link-btn:hover{color:var(--accent-ink)}
.ans input{flex:1;padding:10px 13px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);
  color:var(--ink);font-family:var(--mono);font-size:15px}
.ans input:focus{outline:none;border-color:var(--accent)}
.ans button{white-space:nowrap}
.strict{font-size:12px;color:var(--faint);margin-top:9px;display:flex;align-items:center;gap:6px}
.strict b{color:var(--muted);font-weight:600}
.fb{margin-top:11px;font-size:14px;font-weight:600;padding:9px 12px;border-radius:8px;display:none}
.fb.ok{display:block;color:var(--good);background:var(--good-soft)}
.fb.no{display:block;color:var(--bad);background:var(--bad-soft)}
.fb.shown{display:block;color:var(--gold);background:var(--gold-soft)}
.qcard.correct{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.qcard.revealed{border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.done-banner{background:var(--good-soft);color:var(--good);border-radius:11px;padding:16px 18px;
  font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:18px}
.done-banner.reveal{background:var(--gold-soft);color:var(--gold)}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:11px;text-align:left;width:100%;background:var(--surface);
  border:1.5px solid var(--line);border-radius:9px;padding:11px 13px;color:inherit;font:inherit;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.shown{border-color:var(--gold);background:var(--gold-soft)}
.opt:disabled{cursor:default}
.optk{width:23px;height:23px;border-radius:6px;background:var(--surface-2);color:var(--muted);
  display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;font-family:var(--mono)}
.opt.sel .optk{background:var(--accent);color:#fff}
.opt.right .optk{background:var(--good);color:#fff}
.opt.shown .optk{background:var(--gold);color:#fff}

.match{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:560px){.match{grid-template-columns:1.15fr 1fr}}
.mcol{display:flex;flex-direction:column;gap:7px}
.mrow{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:8px;
  padding:6px 9px;background:var(--surface)}
.mrow.mok{border-color:var(--good);background:var(--good-soft)}
.mrow.mno{border-color:var(--bad);background:var(--bad-soft)}
.mrow.mshown{border-color:var(--gold);background:var(--gold-soft)}
.mnum{width:23px;height:23px;border-radius:6px;background:var(--surface-2);color:var(--muted);
  display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.mnum.alt{background:var(--accent-soft);color:var(--accent-ink);font-family:var(--mono)}
.mtext{flex:1;font-size:14px;font-family:var(--mono)}
.msel{border:1.5px solid var(--line);border-radius:7px;padding:5px 6px;background:var(--bg);
  color:var(--ink);font-weight:700;font-size:13px;font-family:var(--mono)}
.msel:focus{outline:none;border-color:var(--accent)}
.mref{display:flex;flex-direction:column;gap:7px}
.mrefrow{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--muted)}
.mref-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:2px}

.lb{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-top:24px}
.lb-row{display:flex;align-items:center;gap:16px;padding:14px 20px;border-top:1px solid var(--line)}
.lb-row:first-child{border-top:0}
.lb-row .rank{width:28px;color:var(--faint);font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.lb-row .nm{flex:1;font-weight:600}
.lb-row .p{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.lb-row.me{background:var(--accent-soft)}
.lb-row.me .nm{color:var(--accent-ink)}

.scrim{position:fixed;inset:0;background:rgba(10,12,18,.5);display:none;place-items:center;z-index:40;padding:20px}
.scrim.on{display:grid}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:26px;max-width:400px;width:100%}
.modal h2{font-size:22px}
.modal p{color:var(--muted);font-size:14.5px;margin:10px 0 18px}
.modal input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink);font-size:15px;font-family:var(--sans)}
.modal input:focus{outline:none;border-color:var(--accent)}
.modal .btn{margin-top:14px;width:100%;text-align:center}
.demo-note{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.5;min-height:1px}

.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);
  border-radius:12px;padding:26px;text-align:center;margin-top:22px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="brands" id="brands">
      <button class="brand" data-site="puzzling" aria-label="PuzzLing — linguistics puzzles">Puzz<span class="q">Ling</span></button>
      <span class="brand-sep">·</span>
      <button class="brand" data-site="training" aria-label="TrAIning — AI puzzles">Tr<span class="q">AI</span>ning</button>
    </div>
    <nav class="nav" id="nav">
      <button data-go="home">Browse</button>
      <button data-go="board">Leaderboard</button>
    </nav>
    <span class="spacer"></span>
    <span class="pts" id="ptsPill" hidden><span class="dot"></span><span id="ptsVal">0</span> pts</span>
    <span id="authSlot"></span>
  </div>
</header>

<main id="app"></main>

<div class="scrim" id="scrim">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <h2 id="authTitle">Log in</h2>
    <p id="authSub">Welcome back — enter your username and password.</p>
    <input id="uname" type="text" placeholder="username" autocomplete="username" maxlength="24" style="margin-bottom:10px">
    <input id="pass" type="password" placeholder="password" autocomplete="current-password">
    <button class="btn primary" id="authGo">Log in</button>
    <div class="demo-note" id="authNote"></div>
    <div style="margin-top:14px;font-size:13.5px;color:var(--muted)">
      <span id="authSwitchText">New to PuzzLing?</span>
      <button class="link-btn" id="authSwitch" style="padding-left:4px">Create an account</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

let site='puzzling';
function curSite(){return SITES.find(s=>s.id===site)||SITES[0];}
function allPuzzles(){return SITES.flatMap(s=>s.puzzles);}
function findPuzzle(id){return allPuzzles().find(p=>p.id===id);}
function topicById(tid){return SITES.flatMap(s=>s.topics).find(t=>t.id===tid);}

/* ============ state ============ */
let user = null;                 // {id, email, name, pts}
let solved = new Set();          // puzzle ids fully solved (every subpart correct)
let done = new Set();            // "puzzleid#index" — an item fully solved
let awarded = new Set();         // "puzzleid#subpart" — a subpart credited with points

/* ============ forgiving checker (fill-in) ============ */
function normalize(s){
  return s.toLowerCase().normalize('NFC')
    .replace(/[.,;:!?'"“”‘’()\[\]{}\-–—_/\\]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function lev(a,b){
  const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function fillCorrect(item, input){
  const got=normalize(input); if(!got) return false;
  const keys=item.a.split('|').map(normalize);
  return keys.some(k => item.strict==='exact' ? got===k : (got===k || lev(got,k)<=1));
}

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const app=$('#app');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2400)}
function count(topic){return curSite().puzzles.filter(p=>p.topic===topic).length}
function solvedInTopic(topic){return curSite().puzzles.filter(p=>p.topic===topic&&solved.has(p.id)).length}
const LET=k=>String.fromCharCode(65+k);

/* ---- per-subpart scoring: every correct question or match-pair banks points ---- */
const SUBPTS={Easy:5,Medium:10,Hard:15};
function perSub(p){return SUBPTS[p.diff]||10;}
function subCount(p){return p.items.reduce((n,it)=>n+(it.type==='match'?it.left.length:1),0);}
function puzzleTotal(p){return perSub(p)*subCount(p);}
function awardSub(p,subId){                 // credits one subpart once; returns points gained (0 if already earned)
  const key=p.id+'#'+subId;
  if(awarded.has(key)) return 0;
  awarded.add(key);
  const pts=perSub(p); user.pts+=pts;
  if(sb) sb.from('solves').upsert({user_id:user.id,puzzle_id:p.id,subpart:subId,points:pts},{onConflict:'user_id,puzzle_id,subpart'})
    .then(({error})=>{ if(error) console.warn('save subpart failed', error.message); });
  return pts;
}

function renderBody(body){
  return (body||[]).map(b=>{
    if(b.type==='data')  return `<div class="data">${b.lines.map(esc).join('\n')}</div>`;
    if(b.type==='formula') return `<div class="formula">${esc(b.tex)}</div>`;
    if(b.type==='note')  return `<div class="note">${esc(b.text)}</div>`;
    if(b.type==='lead')  return `<p class="lead">${esc(b.text)}</p>`;
    if(b.type==='table') return `<div class="tablewrap"><table class="ptable">
        <thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>`;
    return `<p>${esc(b.text)}</p>`;
  }).join('');
}

function actionRow(i,st,label){
  if(st!=='active') return '';
  return `<div class="ans">
    <button class="btn primary" data-check="${i}">${label||'Check'}</button>
  </div>`;
}
function fbClass(st){return st==='solved'?'ok':(st==='revealed'?'shown':'');}
function fbText(st){return st==='solved'?'Correct!':'';}

function itemControls(it,i,st){
  const show = st==='solved';
  const cls  = 'right';
  const fb   = `<div class="fb ${fbClass(st)}" data-fb="${i}">${fbText(st)}</div>`;
  if(it.type==='choice'){
    return `<div class="opts">
      ${it.options.map((o,k)=>`<button class="opt ${show&&k===it.answer?cls:''}" data-opt="${k}" ${st==='active'?'':'disabled'}>
        <span class="optk">${LET(k)}</span><span>${esc(o)}</span></button>`).join('')}
    </div>
    ${actionRow(i,st)}${fb}`;
  }
  if(it.type==='match'){
    return `<div class="match">
      <div class="mcol">
        ${it.left.map((l,r)=>`<div class="mrow ${show?'mok':''}" data-mrow="${r}">
          <span class="mnum">${r+1}</span><span class="mtext">${esc(l)}</span>
          <select class="msel" data-msel="${r}" aria-label="Match for ${esc(l)}" ${st==='active'?'':'disabled'}>
            <option value="">–</option>
            ${it.right.map((_,k)=>`<option value="${k}" ${show&&it.answer[r]===k?'selected':''}>${LET(k)}</option>`).join('')}
          </select>
        </div>`).join('')}
      </div>
      <div class="mref">
        <div class="mref-title">Meanings</div>
        ${it.right.map((rt,k)=>`<div class="mrefrow"><span class="mnum alt">${LET(k)}</span><span>${esc(rt)}</span></div>`).join('')}
      </div>
    </div>
    ${actionRow(i,st,'Check matches')}${fb}`;
  }
  return `<div class="ans">
      <input type="text" placeholder="Type your answer…" value="${show?esc(it.a.split('|')[0]):''}" ${st==='active'?'':'disabled'} aria-label="Answer">
      ${st==='active'?`<button class="btn primary" data-check="${i}">Check</button>`:''}
    </div>
    ${st==='active'?`<div class="strict"><b>Spelling:</b> ${it.strict==='exact'?'exact match needed':'forgiving — typos & formatting OK'}</div>`:''}
    ${fb}`;
}

function itemState(p,i){
  return done.has(p.id+'#'+i)?'solved':'active';
}
function viewPuzzle(id){
  const p=findPuzzle(id); const t=topicById(p.topic);
  const allDone=p.items.every((_,i)=>done.has(p.id+'#'+i));
  const banner = allDone ? `<div class="done-banner">✓ Solved — every part correct!</div>` : '';

    <button class="back" data-go="topic" data-arg="${p.topic}">← ${esc(t.name)}</button>

        <h2>${esc(p.title)}</h2>

          ${(p.tags||[]).map(tg=>`<span class="chip tag">${esc(tg)}</span>`).join('')}

/* ============ events ============ */
app.addEventListener('click',e=>{
  const opt=e.target.closest('.opt');
  if(opt && !opt.disabled){
    opt.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
    opt.classList.add('sel'); return;
  }
  const b=e.target.closest('[data-topic],[data-puzzle],[data-go],[data-check]');
  if(!b) return;
  if(b.dataset.topic!==undefined&&b.dataset.topic) return go('topic',b.dataset.topic);
  if(b.dataset.puzzle) return go('puzzle',b.dataset.puzzle);
  if(b.dataset.go) return go(b.dataset.go,b.dataset.arg);
  if(b.dataset.check!==undefined) return checkAnswer(b);
});
app.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('.ans input')){
    e.preventDefault(); const card=e.target.closest('.qcard');
    checkAnswer(card.querySelector('[data-check]'));
  }});

function checkAnswer(btn){
  const p=findPuzzle(view.arg); const i=+btn.dataset.check; const it=p.items[i];
  const card=btn.closest('.qcard'); const fb=card.querySelector('[data-fb]');
  if(!user){openSignin();return}
  if(it.type==='choice'){
    const sel=card.querySelector('.opt.sel');
    if(!sel){fb.className='fb no';fb.textContent='Pick an answer first.';return}
    if(+sel.dataset.opt===it.answer){
      card.querySelectorAll('.opt').forEach(o=>{o.disabled=true;o.classList.remove('sel');
        if(+o.dataset.opt===it.answer)o.classList.add('right')});
      const g=awardSub(p, String(i));
      finishItem(p,i,card,fb,btn,'✓ Correct', g);
    }else{ fb.className='fb no'; fb.textContent='Not quite — try another option.'; }
    return;
  }
  if(it.type==='match'){
    const sels=[...card.querySelectorAll('.msel')]; let right=0, blank=0, gained=0;
    sels.forEach(s=>{
      if(s.value===''){blank++; return;}
      const r=+s.dataset.msel;
      if(+s.value===it.answer[r]){ right++; gained+=awardSub(p, i+':'+r); }
    });
    if(right===it.answer.length){
      sels.forEach(s=>{s.disabled=true; s.closest('.mrow').classList.add('mok');});
      finishItem(p,i,card,fb,btn,'✓ Correct', gained);
    }else{
      fb.className='fb no';
      const head = blank ? `${right} of ${it.answer.length} matched so far — ${blank} still blank.`
                         : `${right} of ${it.answer.length} matched.`;
      fb.textContent = head + (gained ? ` +${gained} pts banked — keep going.` : ' Keep trying.');
      if(gained){ renderAuth(); toast(`+${gained} pts`); }
    }
    return;
  }
  const input=card.querySelector('input');
  if(fillCorrect(it,input.value)){
    input.disabled=true;
    const g=awardSub(p, String(i));
    finishItem(p,i,card,fb,btn,'✓', g);
  }else{
    fb.className='fb no';
    fb.textContent = it.strict==='exact'
      ? 'Not quite — this one needs an exact match. Check every character.'
      : 'Not quite — look again at the clues.';
  }
}

function markComplete(p,card){
  const col=card.parentElement;
  const allDone=p.items.every((_,k)=>done.has(p.id+'#'+k));
  if(!allDone || col.querySelector('.done-banner')) return;
  solved.add(p.id);
  col.insertAdjacentHTML('afterbegin',`<div class="done-banner">✓ Solved — every part correct!</div>`);
}

function finishItem(p,i,card,fb,btn,label,gained){
  fb.className='fb ok'; fb.textContent = gained ? `Correct! +${gained} pts` : 'Correct!';
  btn.disabled=true; btn.textContent=label;
  card.classList.add('correct');
  done.add(p.id+'#'+i);
  if(gained){ renderAuth(); toast(`+${gained} pts`); }
  markComplete(p,card);
}

async function submitAuth(){
  const u=$('#uname').value.trim(), p=$('#pass').value, note=$('#authNote');
  if(!/^[A-Za-z0-9_]{2,24}$/.test(u)){note.textContent='Username: 2–24 letters, numbers, or underscores.';return;}
  if(p.length<6){note.textContent='Password must be at least 6 characters.';return;}
  if(!sb){note.textContent='Sign-in is offline right now.';return;}
  $('#authGo').disabled=true;
  const email=emailFor(u);
  try{
    if(authMode==='signup'){
      note.textContent='Creating account…';
      const { data, error } = await sb.auth.signUp({ email, password:p });
      if(error){ note.textContent=/registered|already/i.test(error.message)
          ?'That username is taken — try logging in instead.':error.message; return; }
      if(data.session && data.user){
        const { error:pe } = await sb.from('profiles').insert({ id:data.user.id, username:u });
        if(pe && !/duplicate|unique/i.test(pe.message)) console.warn(pe.message);
        await loadProgress(data.user, u);
      }else{
        note.textContent='Almost there — email confirmation is still switched on in Supabase. Turn it off (one toggle) and try again.';
      }
    }else{
      note.textContent='Logging in…';
      const { data, error } = await sb.auth.signInWithPassword({ email, password:p });
      if(error){ note.textContent=/invalid|credential/i.test(error.message)
          ?'Wrong username or password.':error.message; return; }
      await onSignedIn(data.user);
    }
  }finally{ $('#authGo').disabled=false; }
}
$('#authGo').onclick=submitAuth;
$('#uname').addEventListener('keydown',e=>{if(e.key==='Enter')$('#pass').focus();});
$('#pass').addEventListener('keydown',e=>{if(e.key==='Enter')submitAuth();});

async function onSignedIn(au){
  let { data: prof } = await sb.from('profiles').select('username').eq('id', au.id).maybeSingle();
  let username = prof ? prof.username : au.email.split('@')[0];
  if(!prof){ await sb.from('profiles').insert({ id:au.id, username }); }
  await loadProgress(au, username);
}
async function loadProgress(au, username){
  const { data: rows } = await sb.from('solves').select('puzzle_id,subpart,points').eq('user_id', au.id);
  solved.clear(); done.clear(); awarded.clear(); let pts=0;
  (rows||[]).forEach(r=>{ awarded.add(r.puzzle_id+'#'+r.subpart); pts+=r.points; });
  allPuzzles().forEach(p=>{
    let all = p.items.length>0;
    p.items.forEach((it,i)=>{
      const subs = it.type==='match' ? it.left.map((_,r)=>i+':'+r) : [String(i)];
      if(subs.every(s=>awarded.has(p.id+'#'+s))) done.add(p.id+'#'+i); else all=false;
    });
    if(all) solved.add(p.id);
  });
  user={ id:au.id, email:au.email, name:username, pts };
  closeSignin(); renderAuth(); render(); toast('Signed in');
}
async function signOut(){
  if(sb) await sb.auth.signOut();
  user=null; solved.clear(); done.clear(); awarded.clear();
  renderAuth(); render();
}
async function boot(){
  render(); setAuthMode('login');
  if(!sb) return;
  const { data:{ session } } = await sb.auth.getSession();
  if(session && session.user) await onSignedIn(session.user);
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='SIGNED_IN' && session && session.user){
      if(!user || user.id!==session.user.id) onSignedIn(session.user);
    }else if(event==='SIGNED_OUT'){
      user=null; solved.clear(); done.clear(); awarded.clear(); renderAuth(); render();
    }
  });
}
boot();
</script>
